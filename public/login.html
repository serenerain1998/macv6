<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — Melissa Casole</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p.sub {
      margin: 0 0 28px 0;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      transition: border-color 0.2s, background 0.2s;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      background: rgba(255, 255, 255, 0.07);
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(102, 126, 234, 0.3);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">This portfolio contains client work under NDA. Enter the access password to continue.</p>
    <form id="loginForm" autocomplete="off">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autofocus>
      <button type="submit" id="submitBtn">Sign in</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('show');
      }
      function clearError() {
        errorEl.classList.remove('show');
      }

      function getNextPath() {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        // Only allow same-origin paths.
        if (!next.startsWith('/') || next.startsWith('//')) return '/';
        return next;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          if (res.ok) {
            // Tell the legacy client-side password modal to stay hidden.
            try {
              localStorage.setItem('portfolioAuthenticated', 'true');
              localStorage.setItem('portfolioAuthTimestamp', Date.now().toString());
            } catch (_) { /* private browsing — ignore */ }
            window.location.href = getNextPath();
            return;
          }
          const data = await res.json().catch(() => ({}));
          showError(data.message || 'Invalid password');
        } catch (err) {
          showError('Connection error. Try again.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
